<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bijay Chalise - Games</title>
  <meta name="description" content="Official website for Rush Hour 3D and games by Bijay Chalise.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-wrapper {
      margin-bottom: 24px;
    }
    .logo-img {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .logo-img:hover {
      transform: scale(1.04);
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p.tagline {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 32px;
      font-weight: 500;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #000000;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 260px;
    }
    .play-btn:hover {
      background-color: #1e293b;
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }
    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    footer {
      margin-top: 64px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <img src="logo.png" alt="Rush Hour 3D" class="logo-img" />
    </div>

    <h1>Rush Hour 3D</h1>
    <p class="tagline">Official game by Bijay Chalise</p>

    <a href="https://play.google.com/store/apps/details?id=rush.e" target="_blank" rel="noopener noreferrer" class="play-btn">
      <svg viewBox="0 0 24 24">
        <path d="M3.609 1.814L13.792 12 3.61 22.186a2.023 2.023 0 0 1-.61-1.464V3.278c0-.585.228-1.127.609-1.464zm11.235 11.238l2.585 2.585-11.839 6.837 9.254-9.422zm0-2.104L5.59 1.526l11.839 6.837-2.585 2.585zm1.488 1.488l3.666 2.117c.928.536.928 1.408 0 1.944l-3.666 2.117-2.072-2.072 2.072-2.106z"/>
      </svg>
      <span>Get on Google Play</span>
    </a>

    <footer>
      <p>&copy; 2026 Bijay Chalise</p>
    </footer>
  </div>
</body>
</html>
